<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势音乐播放器</title>
    <link rel="stylesheet" href="/static/index.css">
</head>
<body>
    <div class="container">
        <h1>🎵 手势音乐播放器</h1>

        <div class="status-section">
            <div class="status-item">
                <span class="label">WebSocket状态:</span>
                <span id="ws-status" class="status disconnected">未连接</span>
            </div>
            <div class="status-item">
                <span class="label">当前指令:</span>
                <span id="current-command" class="command">idle</span>
            </div>
            <div class="status-item">
                <span class="label">置信度:</span>
                <span id="confidence">0.0</span>
            </div>
        </div>

        <div class="player-section">
            <h2>播放控制</h2>
            <div class="controls">
                <button id="play-btn" class="btn">▶️ 播放</button>
                <button id="pause-btn" class="btn">⏸️ 暂停</button>
                <button id="next-btn" class="btn">⏭️ 下一首</button>
                <button id="prev-btn" class="btn">⏮️ 上一首</button>
                <button id="vol-up-btn" class="btn">🔊 音量+</button>
                <button id="vol-down-btn" class="btn">🔉 音量-</button>
            </div>
        </div>

        <div class="music-list-section">
            <h2>音乐列表</h2>
            <ul id="music-list" class="music-list">
                <!-- 音乐列表将通过JavaScript动态加载 -->
            </ul>
        </div>

        <div class="gesture-guide">
            <h2>手势说明</h2>
            <div class="gesture-grid">
                <div class="gesture-item">
                    <span class="gesture-icon">👊</span>
                    <span class="gesture-desc">0指: 暂停</span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">☝️</span>
                    <span class="gesture-desc">1指: 下一首</span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">✌️</span>
                    <span class="gesture-desc">2指: 上一首</span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">🤟</span>
                    <span class="gesture-desc">3指: 音量+</span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">🤞</span>
                    <span class="gesture-desc">4指: 音量-</span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">🖐️</span>
                    <span class="gesture-desc">5指: 播放</span>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/index.js"></script>
</body>
</html>
