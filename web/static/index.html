<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势音乐播放器</title>
    <link rel="stylesheet" href="/static/index.css">
</head>
<body>
    <div class="container">
        <h1>
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            手势音乐播放器
        </h1>

        <div class="video-section">
            <h2>实时手势监控</h2>
            <div class="video-container">
                <img src="/video_feed" alt="Gesture Video Feed">
            </div>
        </div>

        <div class="status-section">
            <div class="status-item">
                <span class="label">WebSocket状态:</span>
                <span id="ws-status" class="status disconnected">未连接</span>
            </div>
            <div class="status-item">
                <span class="label">当前指令:</span>
                <span id="current-command" class="command">idle</span>
            </div>
            <div class="status-item">
                <span class="label">置信度:</span>
                <span id="confidence">0.0</span>
            </div>
        </div>

        <div class="player-section">
            <h2>播放控制</h2>
            <div class="controls">
                <button id="play-btn" class="btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 播放
                </button>
                <button id="pause-btn" class="btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> 暂停
                </button>
                <button id="next-btn" class="btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg> 下一首
                </button>
                <button id="prev-btn" class="btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg> 上一首
                </button>
                <button id="vol-up-btn" class="btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg> 音量+
                </button>
                <button id="vol-down-btn" class="btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg> 音量-
                </button>
            </div>
        </div>

        <div class="music-list-section">
            <h2>音乐列表</h2>
            <ul id="music-list" class="music-list">
                <!-- 音乐列表将通过JavaScript动态加载 -->
            </ul>
        </div>

        <div class="gesture-guide">
            <h2>手势说明</h2>
            <div class="gesture-grid">
                <div class="gesture-item">
                    <span class="gesture-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><text x="12" y="16" text-anchor="middle" font-size="14" fill="currentColor" font-weight="bold">0</text></svg>
                    </span>
                    <span class="gesture-desc">0指: 暂停</span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><text x="12" y="16" text-anchor="middle" font-size="14" fill="currentColor" font-weight="bold">1</text></svg>
                    </span>
                    <span class="gesture-desc">1指: 下一首</span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><text x="12" y="16" text-anchor="middle" font-size="14" fill="currentColor" font-weight="bold">2</text></svg>
                    </span>
                    <span class="gesture-desc">2指: 上一首</span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><text x="12" y="16" text-anchor="middle" font-size="14" fill="currentColor" font-weight="bold">3</text></svg>
                    </span>
                    <span class="gesture-desc">3指: 音量+</span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><text x="12" y="16" text-anchor="middle" font-size="14" fill="currentColor" font-weight="bold">4</text></svg>
                    </span>
                    <span class="gesture-desc">4指: 音量-</span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><text x="12" y="16" text-anchor="middle" font-size="14" fill="currentColor" font-weight="bold">5</text></svg>
                    </span>
                    <span class="gesture-desc">5指: 播放</span>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/index.js"></script>
</body>
</html>
